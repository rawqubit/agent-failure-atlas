name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Validate every entry and run every reproduction
        run: python check.py
      - name: The assembled atlas must match the entries
        run: python check.py --assemble && git diff --exit-code ATLAS.md
      - name: Run the whole atlas
        run: |
          ids=$(python3 atlas.py list | awk '{print $1}' | grep -E '^[A-Z]+-[0-9]{2}$')
          count=$(echo "$ids" | wc -l)
          echo "running $count reproductions"
          for id in $ids; do
            python3 atlas.py repro "$id" > /dev/null || { echo "repro $id failed"; exit 1; }
          done
          echo "all reproductions exited 0"
